[project]
name = "novamart-assistant"
version = "0.1.0"
description = "NovaMart store-employee assistant: policy Q&A grounded in company docs plus order lookup, built on Gemini + ADK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "google-adk==2.8.0",      # pinned: 1.39.1 shipped one day after 2.8.0 on a parallel track; unpinned is ambiguous
  "google-genai==2.22.0",   # ADK 2.8 requires >=2.19,<3
  "numpy>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "pydantic>=2.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.6"]

[project.scripts]
novamart = "novamart_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novamart_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls the Gemini API (needs GOOGLE_API_KEY); deselected by default"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"novamart_agent/__init__.py" = ["F401"]  # ADK requires exactly `from . import agent`
